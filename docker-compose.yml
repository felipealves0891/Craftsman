services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CraftsmanDb: Host=postgres;Port=5432;Database=craftsman;Username=craftsman;Password=craftsman_dev_password
      Cache__Enabled: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: craftsman
      POSTGRES_USER: craftsman
      POSTGRES_PASSWORD: craftsman_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftsman -d craftsman"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
