name: craftsman
services:
  app:
    restart: always
    build:
      context: ..
      dockerfile: Dockerfile
    environment:     
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CraftsmanDb: Host=postgres;Port=5432;Database=craftsman;Username=craftsman;Password=craftsman_dev_password
      Cache__Enabled: "true"
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      postgres:
        condition: service_healthy

  app_hom:
    restart: always
    build:
      context: ..
      dockerfile: Dockerfile
    environment:     
      ASPNETCORE_ENVIRONMENT: Homologation
      ConnectionStrings__CraftsmanDb: Host=postgres;Port=5432;Database=craftsman_hom;Username=craftsman;Password=craftsman_dev_password
      Cache__Enabled: "true"
    ports:
      - "9090:8080"
      - "9443:8443"
    depends_on:
      postgres:
        condition: service_healthy
        
  app_dev:
    restart: always
    build:
      context: ..
      dockerfile: Dockerfile
    environment:     
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CraftsmanDb: Host=postgres;Port=5432;Database=craftsman_dev;Username=craftsman;Password=craftsman_dev_password
      Cache__Enabled: "true"
    ports:
      - "9091:8080"
      - "9444:8443"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: craftsman
      POSTGRES_USER: craftsman
      POSTGRES_PASSWORD: craftsman_dev_password
      POSTGRES_MULTIPLE_DATABASES: craftsman_dev, craftsman_hom 
    ports:
      - "5432:5432"
    volumes:
      - "D:/Volumes/Craftsman/postgres_data:/var/lib/postgresql/data"
      - ./pg-init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftsman -d craftsman"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@craftsman.com
      PGADMIN_DEFAULT_PASSWORD: craftsman_admin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - "D:/Volumes/Craftsman/postgres_admin:/var/lib/pgadmin"
    depends_on:
      postgres:
        condition: service_healthy