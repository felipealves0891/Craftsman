# spectro-managed: true
version: "1.0"
paths:
  root: .spectro
  features: .spectro/features
  templates: .spectro/templates
  evidence: evidence
workflow:
  states: [pending, running, completed, failed, blocked, waiting_input, invalidated]
  retry_limit: 3
  fail_fast: true
  timeout_seconds: 900
  require_human_approval_for_scope_changes: true
  human_approval_stages: [plan, completed]
recovery:
  automatic_correction: false
  preserve_evidence: true
  invalidate_on_change: true
gates:
  required: [build, test, security, coverage]
  optional: []
  commands:
    build: 'dotnet build --no-restore --warnaserror -v minimal'
    test: 'dotnet test --no-restore --no-build'
    coverage: 'pwsh -NoProfile -ExecutionPolicy Bypass -File ".spectro/tools/coverage-gate.ps1" -Project "." -BaseBranch "develop" -MinLineCoverage 85 -MinBranchCoverage 60 -MinNewLineCoverage 90 -MinNewBranchCoverage 85'
    security: 'dotnet list package --vulnerable'
